name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Unpack project
        run: |
          if unzip -qq -o project.zip 2>/dev/null; then
            echo "unpacked binary zip"
          else
            base64 -d project.zip > _p.zip && unzip -qq -o _p.zip && rm -f _p.zip
            echo "unpacked base64 zip"
          fi
          rm -f project.zip

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.eduswap --project-name eduswap .

      - name: Provide placeholder Firebase config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "123456789012", "project_id": "eduswap-demo", "storage_bucket": "eduswap-demo.appspot.com" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123456789012:android:0f1e2d3c4b5a69788796a5", "android_client_info": { "package_name": "com.eduswap.eduswap" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY00" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
            "configuration_version": "1"
          }
          JSON

      - name: Apply Android build configuration
        run: ./scripts/configure_android.sh

      - name: Install packages
        run: flutter pub get

      - name: Patch plugins (jcenter -> mavenCentral)
        run: ./scripts/patch_plugins.sh

      - name: Generate code (Freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduswap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: EduSwap APK v0.1.0
          body: Built automatically by GitHub Actions for the EduSwap Flutter app.
          files: build/app/outputs/flutter-apk/app-release.apk
